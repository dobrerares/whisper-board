[versions]
agp = "8.7.3"
kotlin = "2.1.10"
ksp = "2.1.10-1.0.31"
composeBom = "2024.12.01"
coroutines = "1.9.0"
okhttp = "4.12.0"
securityCrypto = "1.0.0"
datastore = "1.1.1"
